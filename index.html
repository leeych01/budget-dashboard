<!DOCTYPE html>
<html lang="ko">
<head>
<title>가계부 대시보드</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f4f7fc; --card: #ffffff; --ink: #1d2b45; --sub: #6b7a95; --line: #eef2f8;
    --blue: #2f6fde; --auto: #9db7e8; --track: #e3e9f4; --soft: #f0f5ff;
    --chip-bg: #fff2d6; --chip-ink: #a35a00; --down: #1a7f4b; --up: #d33b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --ink: #eceef2; --sub: #9aa1ab; --line: #2b3038;
      --blue: #5b8cff; --auto: #3d5a8f; --track: #2b3038; --soft: #232833;
      --chip-bg: #3a2e14; --chip-ink: #f0c060; --down: #4cc38a; --up: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 12px 14px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; }
  .top h1 { font-size: 18px; margin: 0; }
  .nav { background: none; border: 0; color: var(--blue); font-size: 22px; padding: 4px 12px; cursor: pointer; }
  .nav:disabled { opacity: .25; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--sub); margin-bottom: 4px; }
  .big { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .mini { font-size: 12px; color: var(--sub); }
  .down { color: var(--down); font-weight: 700; } .up { color: var(--up); font-weight: 700; }
  .chip { display: inline-block; background: var(--chip-bg); color: var(--chip-ink); border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
  .pace { height: 12px; border-radius: 6px; background: var(--track); position: relative; margin: 10px 0 4px; }
  .pace > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 6px; }
  .pace > i.over { background: var(--up); }
  .pace > u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .bar { height: 9px; border-radius: 5px; background: var(--track); margin: 4px 0 10px; position: relative; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 5px; }
  .bar.auto > i { background: var(--auto); }
  .grp { display: block; width: 100%; }
  .grp:focus-visible { outline: 2px solid var(--blue); border-radius: 6px; }
  .open { background: var(--soft); border-radius: 10px; padding: 6px 10px; margin: -6px 0 10px; font-size: 12.5px; }
  .open div { display: flex; justify-content: space-between; padding: 2px 0; }
  .days { display: flex; align-items: flex-end; gap: 2px; height: 64px; }
  .days i { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; min-height: 2px; }
  .days i.f { background: var(--track); }
  .months { display: flex; align-items: flex-end; gap: 10px; height: 110px; padding-top: 6px; }
  .months div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11.5px; text-align: center; color: var(--sub); }
  .months b { display: block; background: var(--blue); border-radius: 3px 3px 0 0; }
  .months b.a { background: var(--auto); border-radius: 0; }
  .months div.sel { color: var(--ink); font-weight: 700; }
  .li { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li .m { color: var(--sub); font-size: 12px; }
  button.li { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 8px; width: 100%;
    font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  button.li:focus-visible { outline: 2px solid var(--blue); border-radius: 6px; }
  button.li { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }   /* 꾹 누를 때 글자 선택·폰 메뉴 안 뜨게 */
  .li.gone { opacity: .45; }
  .pick .msg { width: 100%; font-size: 12.5px; color: var(--sub); }
  button.btn.danger { background: #c62828; }
  button.btn.ghost { background: var(--track); color: var(--ink); }
  .pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--soft); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .pick select, .pick input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--track); border-radius: 8px; padding: 6px 8px; }
  .pick select { flex-basis: 100%; }
  .pick label { width: 100%; font-size: 12.5px; color: var(--sub); }
  .neg { color: var(--down); }
  .confirm { display: flex; gap: 6px; margin-top: 6px; }
  .confirm input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--track); border-radius: 8px; padding: 6px 8px; }
  button.btn, a.btn { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 8px; padding: 6px 12px;
    background: var(--blue); color: #fff; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--sub); }
  .pager button:disabled { opacity: .3; cursor: default; }
  .empty { color: var(--sub); font-size: 13px; padding: 6px 0; }
  .foot { text-align: center; color: var(--sub); font-size: 12px; margin-top: 8px; }
  .hidden { display: none; }
  .nums { margin-top: 8px; font-size: 12.5px; color: var(--sub); }
  .nums summary { cursor: pointer; }
  .nums div div { display: flex; justify-content: space-between; padding: 2px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="nav" id="prev" aria-label="이전 달">◀</button>
    <h1 id="title"></h1>
    <button class="nav" id="next" aria-label="다음 달">▶</button>
  </div>

  <section class="card" aria-label="이번 달 지출">
    <div class="t"><span id="periodLabel"></span><span id="chip"></span></div>
    <div class="big" id="total"></div>
    <div class="mini" id="split"></div>
    <div id="paceBox" class="hidden">
      <div class="pace" id="pace"><i></i><u></u></div>
      <div class="lbl mini"><span id="paceText"></span><span id="markText"></span></div>
    </div>
    <div class="mini" id="compare" style="margin-top:4px"></div>
  </section>

  <section class="card" aria-label="어디에 썼나">
    <div class="t"><span>어디에 썼나</span></div>
    <div id="groups"></div>
  </section>

  <section class="card" aria-label="날마다 쓴 돈">
    <div class="t"><span>날마다 쓴 돈 (변동지출)</span><span id="dayMax"></span></div>
    <div class="days" id="days"></div>
    <div class="lbl mini"><span>1일</span><span id="lastDay"></span></div>
    <details class="nums"><summary>숫자로 보기</summary><div id="dayNums"></div></details>
  </section>

  <section class="card" aria-label="최근 6개월">
    <div class="t"><span>최근 6개월</span><span><span style="color:var(--blue)">■</span> 변동지출 <span style="color:var(--auto)">■</span> 고정지출</span></div>
    <div class="months" id="months"></div>
    <details class="nums"><summary>숫자로 보기</summary><div id="monthNums"></div></details>
  </section>

  <section class="card hidden" id="todoCard" aria-label="확인할 것">
    <div class="t"><span>확인할 것</span></div>
    <div id="todo"></div>
  </section>

  <section class="card" aria-label="결제 목록">
    <div class="t"><span id="listTitle" tabindex="-1"></span><a class="btn" id="quick">+ 빠른 입력</a></div>
    <div id="list"></div>
  </section>

  <div class="foot" id="updated"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // <API> GitHub 페이지 판 (tools/build_pages.js 가 만듦). 숫자는 구글 Apps Script 에서 직접 받음
  const EXEC = "https://script.google.com/macros/s/AKfycbwqyuErkeVGRFnAB63q4YWJzlarKMwMFqFoA0c7zOHVUC_NLIsm96dIVrs1wlgh6hw-nQ/exec";
  const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  const QUICK = EXEC + '?t=' + encodeURIComponent(TOKEN);
  // 직전 이번 달 숫자 (이 폰 브라우저에만, 먼저 보여 주고 새로 받음). 보안(Codex 점검):
  //  - 합계·그래프 + 이번 달 결제 목록(날짜·가게·카드사(끝자리 뺌)·카테고리·금액·메모(rev 0.28))을 저장, 7일 지나면 버림.
  //    확인할 것(메모)은 저장 안 함. 목록 저장은 rev 0.24 사용자 결정 (열자마자 목록이 보이게, 위젯에 이미 토큰이 있는 같은 폰)
  //  - 토큰 지문(SHA-256 앞부분)이 맞을 때만 보여 줌, 권한 실패하면 바로 지움 → 틀린 주소로 열어도 안 보임
  const CACHE = 'budget-dash-v2', OLD_CACHE = 'budget-dash-last', KEEP_MS = 7 * 864e5;
  let DATA = null;
  async function fingerprint() {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('budget-dash:' + TOKEN));
    return Array.from(new Uint8Array(b)).slice(0, 8).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function clearCache() { try { localStorage.removeItem(CACHE); localStorage.removeItem(OLD_CACHE); } catch (_) {} }
  async function readCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE));
      if (!c || Date.now() - c.at > KEEP_MS) return null;
      return c.f === await fingerprint() ? c.d : null;
    } catch (_) { return null; }
  }
  async function saveCache(d) {
    try {
      // 카드 끝자리('신한(1234)')는 빼고 저장
      const list = d.list.map(x => Object.assign({}, x, { card: String(x.card || '').replace(/\s*\(\d{3,4}\)\s*$/, '') }));
      const slim = Object.assign({}, d, { list: list, pending: [], checks: [] });
      localStorage.setItem(CACHE, JSON.stringify({ f: await fingerprint(), at: Date.now(), d: slim }));
    } catch (_) {}
  }
  let blocked = false;            // 권한 실패 뒤에는 다시 받지 않음 (화면이 비어 있음)
  function denied() {
    blocked = true; clearCache(); DATA = null;
    document.querySelector('main').textContent = '권한이 없어요. 위젯이나 설정 탭의 대시보드 주소로 다시 열어 주세요.';
  }
  async function call(url, opt) {
    const r = await fetch(url, opt);
    let j;
    try { j = await r.json(); } catch (_) { const e = new Error('권한이 없거나 연결이 안 돼요'); e.auth = true; throw e; }
    if (j && j.ok === false) { const e = new Error(j.error || '실패'); e.auth = j.error === 'bad token'; throw e; }
    return j;
  }
  const API = {
    get: (ym, ok, fail) => call(EXEC + '?t=' + encodeURIComponent(TOKEN) + '&f=dash&ym=' + encodeURIComponent(ym || ''))
      .then(ok, e => (e.auth ? denied() : fail(e))),
    // text/plain 으로 보내야 브라우저가 미리 묻는 요청(preflight) 없이 Apps Script 에 바로 감
    confirm: (row, name, amount, ok, fail) => call(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action: 'confirm', row: row, name: name, amount: amount }) }).then(ok, fail),
    setcat: (x, cat, remember, ok, fail) => call(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action: 'setcat', row: x.row, name: x.merchant, key: x.key, cat: cat, remember: remember }) }).then(ok, fail),
    // old: 보고 있던 메모 (그 사이 시트에서 바뀌었으면 서버가 거부, rev 0.28)
    setmemo: (x, old, memo) => call(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action: 'setmemo', row: x.row, name: x.merchant, key: x.key, old: old, memo: memo }) }),
    // 삭제한('중복') 줄을 분류규칙 카테고리로 되돌림 (서버 rev 0.26). 삭제는 setcat 으로 '중복'
    restore: x => call(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, action: 'restore', row: x.row, name: x.merchant, key: x.key }) }),
  };
  // </API>
  const PER = 10;                 // 결제 목록 한 쪽에 보일 줄 수 (rev 0.30)
  let page = 0;                   // 보고 있는 쪽 (0 = 1쪽). 조용히 다시 받을 때는 그대로, 달을 옮기면 1쪽
  let editing = null;             // 카테고리·메모를 고치는 중인 결제 { row, cat, remember, memo } (다시 그려도 고른 값 유지)
  let saving = false;             // 카테고리·메모·삭제 저장 중 (두 번 보내지 않게)
  let holding = null;             // 꾹 눌러 [삭제]·[되살리기]를 연 결제의 줄 번호 (rev 0.32)
  const DUP = '중복';             // 삭제 = 시트 줄은 두고 카테고리 '중복' → 합계 제외 (같은 알림이 또 와도 다시 기록 안 됨)
  const grpOf = x => x.grp || x.cat;   // 서버가 준 묶음 (rev 0.33). 옛 폰 저장본엔 없어 카테고리 이름으로
  const unsorted = g => g === '기타' || g === '미분류';
  const HOLD_MS = 550;            // 이만큼 누르고 있으면 꾹 누름
  let held = false;               // 이번 누름이 꾹 누름이 됨 → 손을 뗄 때 브라우저가 보내는 click 은 무시 (다시 그린 줄에 와서 분류 칸이 열리지 않게)
  ['pointerdown', 'keydown'].forEach(n => document.addEventListener(n, () => { held = false; }, true));   // 새 누름·키 입력마다 풀림

  const $ = id => document.getElementById(id);
  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const num = n => Math.round(n).toLocaleString('ko-KR');
  const pct = (a, b) => (b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0);

  // 글자는 모두 textContent 로 (가게 이름 등에 <, > 가 있어도 글자 그대로)
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
  }

  let reqId = 0;                  // 늦게 온 옛 응답이 새 화면을 덮지 않게
  let lastYm = '';                // 마지막으로 요청한 달 ('' = 이번 달). 달 이동 중에 돌아와도 그 달을 다시 받게
  function load(ym, quiet) {     // quiet: 보이는 화면을 그대로 두고 뒤에서 새로 받기 (직전 숫자를 먼저 보여 줄 때)
    const my = ++reqId;
    lastYm = ym || '';
    if (quiet && busy()) return;
    if (!quiet) { $('prev').disabled = $('next').disabled = true; $('title').textContent = '불러오는 중…'; }
    API.get(ym,
      // 화면에 쓰는 응답만 폰에 저장 (늦게 온 옛 응답이 저장본을 덮지 않게, Codex 검토 rev 0.28)
      d => { if (my !== reqId || (quiet && busy())) return; if (d.isCurrent) saveCache(d); DATA = d; if (!quiet) { page = 0; editing = holding = null; window.scrollTo(0, 0); } render(); },
      e => { if (my !== reqId) return; toast('불러오지 못했어요: ' + e.message); if (DATA && !(quiet && busy())) render(); });
  }

  function renderHead(d, s) {
    $('title').textContent = d.label;
    $('prev').disabled = false;
    $('next').disabled = !d.nextYm;
    $('periodLabel').textContent = d.isCurrent ? '이번 달 지출 · ' + d.today + '일까지' : (Number(d.ym.slice(5)) + '월 지출');
    $('chip').replaceChildren();
    if (s.attention.count) $('chip').append(el('span', 'chip', '확인 ' + s.attention.count + '건'));
    $('total').textContent = won(s.total);
    $('split').textContent = '변동지출 ' + num(s.live) + ' · 고정지출 ' + num(s.auto) + (s.expected.count ? ' (예상 ' + num(s.expected.amount) + ' 포함)' : '');

    const p = s.pace;
    $('paceBox').classList.toggle('hidden', !p);
    if (p) {
      const fill = $('pace').querySelector('i'), mark = $('pace').querySelector('u');
      fill.style.width = Math.min(100, Math.max(0, p.ratio)) + '%';
      fill.classList.toggle('over', d.isCurrent && p.ratio > p.mark);
      mark.style.left = Math.min(100, p.mark) + '%';
      mark.classList.toggle('hidden', !d.isCurrent);
      $('paceText').textContent = '변동지출 = ' + s.avg.months + '개월 평균 ' + won(s.avg.live) + '의 ' + Math.round(p.ratio) + '%';
      $('markText').textContent = d.isCurrent ? '┃적정 ' + Math.round(p.mark) + '%' : '';
    }
    const diff = s.total - s.prevSame;
    const c = $('compare'); c.replaceChildren();
    c.append(document.createTextNode(d.isCurrent ? '지난달 같은 날보다 ' : '지난달보다 '));
    c.append(el('span', diff > 0 ? 'up' : 'down', (diff > 0 ? '▲' : diff < 0 ? '▼' : '±') + won(Math.abs(diff))));
  }

  function renderGroups(s) {
    const box = $('groups'); box.replaceChildren();
    const max = Math.max(0, ...s.groups.map(g => g.amount));
    if (!s.groups.length) { box.append(el('div', 'empty', '기록 없음')); return; }
    s.groups.forEach(g => {   // rev 0.33: 묶음만 (카테고리로 펼치지 않음)
      const b = el('div', 'grp');
      const l = el('div', 'lbl');
      const name = el('span', '', g.name);
      if (g.auto) name.append(el('span', 'mini', ' 자동'));
      l.append(name, el('span', '', num(g.amount)));
      const bar = el('div', 'bar' + (g.auto ? ' auto' : '')); const i = el('i'); i.style.width = pct(g.amount, max) + '%'; bar.append(i);
      b.append(l, bar);
      box.append(b);
    });
  }

  function renderDays(d, s) {
    const box = $('days'); box.replaceChildren();
    const max = Math.max(0, ...s.daily);
    s.daily.forEach((v, i) => {
      const future = d.isCurrent && i + 1 > d.today;
      const b = el('i', future || v <= 0 ? 'f' : ''); b.style.height = (future || v <= 0 ? 3 : Math.max(3, pct(v, max))) + '%';
      b.title = (i + 1) + '일 ' + won(v);
      box.append(b);
    });
    const top = s.daily.indexOf(max);
    $('dayMax').textContent = max > 0 ? '최대 ' + (top + 1) + '일 ' + num(max) : '';
    $('lastDay').textContent = s.daily.length + '일';
    const nums = $('dayNums'); nums.replaceChildren();
    s.daily.forEach((v, i) => { if (v) { const r = el('div'); r.append(el('span', '', (i + 1) + '일'), el('span', v < 0 ? 'neg' : '', won(v))); nums.append(r); } });
    if (!nums.children.length) nums.append(el('div', 'empty', '기록 없음'));
  }

  function renderMonths(d) {
    const box = $('months'); box.replaceChildren();
    const max = Math.max(1, ...d.months.map(m => Math.max(0, m.live) + Math.max(0, m.auto)));
    d.months.forEach(m => {
      const c = el('div', m.ym === d.ym ? 'sel' : '');
      const live = el('b'); live.style.height = pct(Math.max(0, m.live), max) * 0.8 + 'px';
      const auto = el('b', 'a'); auto.style.height = pct(Math.max(0, m.auto), max) * 0.8 + 'px';
      c.title = m.label + ' 변동지출 ' + won(m.live) + ' · 고정지출 ' + won(m.auto);
      c.append(live, auto, document.createTextNode(m.label));
      box.append(c);
    });
    const nums = $('monthNums'); nums.replaceChildren();
    d.months.forEach(m => { const r = el('div'); r.append(el('span', '', m.label), el('span', '', '변동지출 ' + num(m.live) + ' · 고정지출 ' + num(m.auto))); nums.append(r); });
  }

  function renderTodo(d) {
    const box = $('todo'); box.replaceChildren();
    $('todoCard').classList.toggle('hidden', !d.pending.length && !d.checks.length);
    d.pending.forEach(p => {
      const r = el('div', 'li'); r.style.display = 'block';
      const top = el('div', 'lbl'); top.append(el('span', '', p.name + ' '), el('span', '', won(p.amount)));
      top.firstChild.append(el('span', 'm', '예상치 · ' + p.date + (p.basis ? ' · ' + p.basis : '')));
      const f = el('div', 'confirm');
      const input = el('input'); input.inputMode = 'numeric'; input.placeholder = '실제 금액'; input.setAttribute('aria-label', p.name + ' 실제 금액');
      const btn = el('button', 'btn', '금액 확정');
      btn.addEventListener('click', () => {
        const v = input.value.trim(), ym = DATA.ym;
        if (!/\d/.test(v)) { toast('금액을 입력해 주세요'); return; }
        btn.disabled = true;
        API.confirm(p.row, p.name, v,
          () => { toast(p.name + ' 확정했어요'); load(ym); },
          e => { btn.disabled = false; toast(e.message); });
      });
      f.append(input, btn); r.append(top, f); box.append(r);
    });
    d.checks.forEach(c => {
      const r = el('div', 'li');
      const left = el('span'); left.append(el('span', 'chip', '점검'), document.createTextNode(' ' + c.merchant + ' '), el('span', 'm', c.date + ' 같은 결제일 수 있음'));
      r.append(left, el('span', 'm', '시트에서 정리'));
      box.append(r);
    });
  }

  function renderList(d) {
    const loading = d.listTotal < 0;   // rev 0.23 이전에 저장된 숫자만 보이는 동안 (그때는 목록을 저장 안 했음)
    const can = !!d.cats && d.cats.length > 0;   // 서버가 카테고리 목록을 줄 때만 눌러서 바꾸기 (rev 0.22)
    const pages = Math.ceil(d.list.length / PER);
    page = Math.max(0, Math.min(page, pages - 1));   // 다시 받은 목록이 짧아졌으면 마지막 쪽으로
    $('listTitle').textContent = Number(d.ym.slice(5)) + '월 결제' + (loading ? '' : ' ' + d.listTotal + '건'
      + (pages > 1 ? ' · ' + (page + 1) + '/' + pages + '쪽' : '') + (can ? ' · 누르면 분류·메모, 꾹 누르면 삭제' : ''));
    const box = $('list'); box.replaceChildren();
    if (!d.list.length) { box.append(el('div', 'empty', loading ? '불러오는 중…' : '기록 없음')); return; }
    d.list.slice(page * PER, page * PER + PER).forEach(x => {
      const r = el(can && x.row ? 'button' : 'div', 'li' + (x.cat === DUP ? ' gone' : ''));
      const left = el('span'); left.append(document.createTextNode(x.date + ' ' + x.merchant), el('br'),
        el('span', 'm', [x.card, x.cat === DUP ? '삭제됨' : grpOf(x), x.flag].filter(Boolean).join(' · ')));
      if (x.memo) left.append(el('br'), el('span', 'm', '✎ ' + x.memo));
      r.append(left, el('span', x.amount < 0 ? 'neg' : '', num(x.amount)));
      const open = !!editing && editing.row === x.row;
      if (r.tagName === 'BUTTON') {
        r.setAttribute('aria-expanded', open);
        r.addEventListener('click', () => {
          if (held) { held = false; return; }
          if (saving) { toast('저장 중이에요. 잠시 뒤에 눌러 주세요'); return; }
          editing = open ? null : { row: x.row, cat: grpOf(x), remember: unsorted(grpOf(x)), memo: x.memo || '' };
          holding = null;
          renderList(DATA);
        });
        holdable(r, x);
      }
      box.append(r);
      if (open) box.append(picker(x));
      if (holding === x.row) box.append(holdBar(x));
    });
    if (d.listTotal > d.list.length && page === pages - 1) box.append(el('div', 'empty', '최근 ' + d.list.length + '건까지만 보여요. 나머지는 시트에서'));
    if (pages > 1) {
      const bar = el('div', 'pager');
      const go = n => () => { page = n; editing = holding = null; renderList(DATA); $('list').parentElement.scrollIntoView({ block: 'start' }); $('listTitle').focus({ preventScroll: true }); };   // 누른 단추가 다시 그려져 사라지므로 제목(몇 쪽인지 읽힘)으로 포커스
      const prev = el('button', 'btn', '◀ 이전'), next = el('button', 'btn', '다음 ▶');
      prev.disabled = page === 0; next.disabled = page === pages - 1;
      prev.addEventListener('click', go(page - 1)); next.addEventListener('click', go(page + 1));
      bar.append(prev, el('span', '', (page + 1) + ' / ' + pages + '쪽'), next);
      box.append(bar);
    }
  }

  // 묶음 고르기·메모 (rev 0.33): 고른 묶음 이름만 서버로 (서버가 묶음 목록에 있는 이름인지 다시 확인)
  function picker(x) {
    const f = el('div', 'pick');
    const sel = el('select'); sel.setAttribute('aria-label', x.merchant + ' 카테고리');
    const cur = grpOf(x), list = DATA.cats.includes(cur) ? DATA.cats : [cur].concat(DATA.cats);
    list.forEach(c => { const o = el('option', '', c); o.value = c; o.selected = c === editing.cat; sel.append(o); });
    const memo = el('input'); memo.type = 'text'; memo.maxLength = 200; memo.value = editing.memo;
    memo.placeholder = '메모 (예: 이월드 주차)'; memo.setAttribute('aria-label', x.merchant + ' 메모');
    const btn = el('button', 'btn', '저장'); btn.disabled = saving;
    const lab = el('label'); const chk = el('input'); chk.type = 'checkbox'; chk.checked = editing.remember;
    lab.append(chk, document.createTextNode(' 이 가게는 앞으로도 (분류규칙에 추가, 같은 가게의 기타도 같이)'));
    sel.addEventListener('change', () => { editing.cat = sel.value; });
    chk.addEventListener('change', () => { editing.remember = chk.checked; });
    memo.addEventListener('input', () => { editing.memo = memo.value; });
    btn.addEventListener('click', () => {
      if (saving) return;
      const was = lastYm, cat = sel.value, remember = chk.checked, note = memo.value.trim(), oldNote = x.memo || '';
      // 기타 그대로 + 앞으로도(기본 체크)는 분류 저장 안 함 (메모만 쓸 때 '기타' 규칙이 생기지 않게)
      const catJob = cat !== cur || (remember && !unsorted(cat)), memoJob = note !== oldNote;
      if (!catJob && !memoJob) { editing = null; renderList(DATA); return; }
      // 서버 저장(약 2초)을 기다리지 않고 목록부터 바꿔 보여 줌 (rev 0.23). 실패하면 되돌림
      const changed = catJob ? DATA.list.filter(y => y === x || (remember && y.merchant === x.merchant && y.cat !== DUP && unsorted(grpOf(y)))) : [];   // 삭제한 줄은 그대로 (Codex)
      const before = changed.map(y => [y.cat, y.grp]);
      changed.forEach(y => { y.cat = y.grp = cat; }); x.memo = note;
      saving = true; editing = null; renderList(DATA);
      // 분류·메모는 따로 저장 → 하나만 실패하면 그것만 되돌림
      Promise.allSettled([catJob && API.setcat(x, cat, remember), memoJob && API.setmemo(x, oldNote, note)]).then(([c, m]) => {
        saving = false;
        if (c.status === 'rejected') changed.forEach((y, i) => { if (y.cat === cat) [y.cat, y.grp] = before[i]; });
        if (m.status === 'rejected' && x.memo === note) x.memo = oldNote;
        if (memoJob && m.status === 'fulfilled') x.memo = m.value.memo;   // 서버가 실제 저장한 글 ('|' → '/' 등)
        if (DATA && DATA.list.includes(x)) renderList(DATA);
        const bad = [c, m].find(r => r.status === 'rejected');
        toast(bad ? '저장 못 했어요: ' + bad.reason.message : x.merchant + (catJob ? ' → ' + cat : ' 메모') + ' 저장했어요');
        // 보던 자리·펼친 줄 수를 그대로 두고 조용히 다시 받음 (묶음 합계도 맞춤)
        // 저장 중에 달을 옮겼으면 다시 받지 않음 (옮긴 달 화면을 이전 달로 되돌리지 않게)
        const saved = (catJob && c.status === 'fulfilled') || (memoJob && m.status === 'fulfilled');
        if (saved && lastYm === was) load(was, true);
      });
    });
    f.append(sel, memo, btn, lab);
    return f;
  }

  // 꾹 누르기: 손가락을 HOLD_MS 동안 떼지도 움직이지도 않으면. 폰이 길게 누름으로 보내는 contextmenu
  // (마우스 오른쪽·키보드 메뉴 키도)도 같은 일 → 폰 메뉴 대신 [삭제]
  function holdable(r, x) {
    let t = null, sx = 0, sy = 0;
    const stop = () => { clearTimeout(t); t = null; };
    r.addEventListener('pointerdown', e => {
      if (e.button) return;
      sx = e.clientX; sy = e.clientY; stop();
      t = setTimeout(() => { t = null; hold(x); }, HOLD_MS);
    });
    r.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) stop(); });   // 스크롤하는 중이면 취소
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => r.addEventListener(n, stop));
    r.addEventListener('contextmenu', e => { e.preventDefault(); stop(); hold(x); });
  }
  function hold(x) {
    if (saving) { toast('저장 중이에요. 잠시 뒤에 눌러 주세요'); return; }
    if (holding === x.row) return;   // 타이머와 contextmenu 가 둘 다 와도 한 번만
    held = true; holding = x.row; editing = null; renderList(DATA);
    const b = $('list').querySelector('.pick button'); if (b) b.focus({ preventScroll: true });
  }

  function holdBar(x) {
    const gone = x.cat === DUP, f = el('div', 'pick');
    f.append(el('div', 'msg', gone ? '삭제한 결제예요. 되살리면 다시 합계에 들어가요.' : '이 결제를 삭제할까요? 합계에서 빠지고, 다시 꾹 누르면 되살릴 수 있어요.'));
    const yes = el('button', gone ? 'btn' : 'btn danger', gone ? '되살리기' : '삭제'), no = el('button', 'btn ghost', '취소');
    no.addEventListener('click', () => { holding = null; renderList(DATA); });
    yes.addEventListener('click', () => (gone ? restore : remove)(x));
    f.append(yes, no);
    return f;
  }

  // 삭제: 서버 저장(약 2초)을 기다리지 않고 바로 흐리게. 실패하면 되돌림
  function remove(x) {
    if (saving) return;
    const was = lastYm, before = { cat: x.cat, flag: x.flag };
    x.cat = DUP;
    if (!/합계 제외/.test(x.flag || '')) x.flag = [x.flag, '합계 제외'].filter(Boolean).join(' · ');
    DATA.listTotal--;
    saving = true; holding = null; renderList(DATA);
    API.setcat(x, DUP, false).then(() => {
      saving = false;
      toast(x.merchant + ' 삭제했어요');
      if (lastYm === was) load(was, true);   // 합계·그래프도 맞춤
    }, e => {
      saving = false;
      if (DATA && DATA.list.includes(x)) { Object.assign(x, before); DATA.listTotal++; renderList(DATA); }
      toast('삭제 못 했어요: ' + e.message);
    });
  }
  // 되살리기: 어느 카테고리로 돌아갈지는 서버가 정하므로 저장 뒤 다시 받음
  function restore(x) {
    if (saving) return;
    const was = lastYm;
    saving = true; holding = null; renderList(DATA);
    toast('되살리는 중…');
    API.restore(x).then(() => {
      saving = false;
      toast(x.merchant + ' 되살렸어요');
      if (lastYm === was) load(was, true);
    }, e => { saving = false; toast('되살리지 못했어요: ' + e.message); });
  }

  function render() {
    const d = DATA, s = d.stats;
    renderHead(d, s); renderGroups(s); renderDays(d, s); renderMonths(d); renderTodo(d); renderList(d);
    $('updated').textContent = d.updated + ' 기준';
  }

  $('prev').addEventListener('click', () => load(DATA.prevYm));
  $('next').addEventListener('click', () => DATA.nextYm && load(DATA.nextYm));
  $('quick').href = QUICK;
  if (DATA) render();
  // <START> 열자마자 직전 숫자(있으면)를 보이고, 뒤에서 이번 달을 새로 받음
  if (!TOKEN) { clearCache(); document.querySelector('main').textContent = '위젯이나 설정 탭의 대시보드 주소(#t=… 포함)로 열어 주세요.'; }
  else { readCache().then(c => { if (c) { DATA = c; render(); load('', true); } else load(''); }); }
  // </START>
  // 위젯을 다시 누르면 브라우저(삼성 인터넷)는 열어 둔 탭을 앞으로 꺼내기만 함(새로고침 없음) → 다시 보일 때마다 새로 받음.
  // 보던 달을 다시 받음 (이번 달은 '' 라서 그 사이 달이 바뀌어도 이번 달)
  // 금액을 입력하는 중이거나 확정을 보내는 중이면 건너뜀 (다시 그리면 입력값이 사라짐)
  // 응답이 오는 사이에 입력을 시작해도 조용히 받은 숫자는 그리지 않음 (load 안에서도 확인)
  // 카테고리를 고르는 칸이 열려 있거나 저장 중이어도 건너뜀 (저장 전 옛 카테고리가 다시 보이지 않게)
  function busy() {
    return saving || Array.from(document.querySelectorAll('.confirm input')).some(i => i.value.trim())
      || !!document.querySelector('.confirm button:disabled, .pick');
  }
  function refresh() {
    if (!TOKEN || blocked || document.hidden) return;
    load(lastYm, !!DATA);
  }
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('pageshow', e => { if (e.persisted) refresh(); });   // 뒤로 가기 캐시에서 되살아난 경우
</script>
</body>
</html>
